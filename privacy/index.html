function renderPolicy(language) {
  const policy = policies[language];

  if (!policy) {
    return;
  }

  let html = `<h1>${policy.title}</h1>`;
  html += `<p>${policy.intro}</p>`;

  policy.sections.forEach(section => {
    html += `<h2>${section.title}</h2>`;

    section.paragraphs.forEach(paragraph => {
      html += `<p>${paragraph}</p>`;
    });
  });

  document.getElementById("policyContent").innerHTML = html;
  document.getElementById("backLink").textContent = policy.back;
  document.documentElement.lang = language;
}


const languageSelect = document.getElementById("languageSelect");

languageSelect.addEventListener("change", function() {
  renderPolicy(this.value);
});

renderPolicy(languageSelect.value);
